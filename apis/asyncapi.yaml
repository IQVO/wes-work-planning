  schemas:
    CloudEventBase:
      type: object
      title: CloudEvent 1.0 context attributes
      description: >-
        The CloudEvents 1.0 structured-mode context attributes common to every
        message this service publishes (integration AND analytics topics).
        Every attribute below is REQUIRED in this fleet (ADR-0027); there is
        no other envelope.
      required:
        - specversion
        - id
        - source
        - type
        - subject
        - time
        - datacontenttype
        - dataschema
      properties:
        specversion:
          type: string
          description: The CloudEvents specification version. Always "1.0".
          enum: ["1.0"]
        id:
          type: string
          format: uuid
          description: >-
            Unique identifier for this event occurrence, a UUID v4 minted
            once per domain event and persisted with the transactional outbox
            row, so a redelivery carries the same id. Combined with `source`
            it is the de-duplication key consumers must use for at-least-once
            delivery.
          minLength: 1
        source:
          type: string
          format: uri-reference
          description: >-
            The context that emitted the event: `/warehouse/wes-work-planning`
            for messages this service PUBLISHES; the producer's own source
            (e.g. `/warehouse/network-inventory-planning`) for CONSUMED
            messages.
          pattern: "^/warehouse/[a-z0-9-]+$"
        type:
          type: string
          description: >-
            The event type, in the form
            `com.warehouse.wes.work-planning.<entity>.<EventName>`.
        subject:
          type: string
          description: >-
            The identifier of the aggregate instance the event is about — a
            process path id for charge/plan/work-pool events, a work unit id
            for work unit events.
        time:
          type: string
          format: date-time
          description: >-
            RFC3339 timestamp of when the domain event occurred, taken from
            the domain clock rather than from publish time.
        datacontenttype:
          type: string
          description: Media type of the `data` member. Always "application/json".
          enum: ["application/json"]
        dataschema:
          type: string
          format: uri
          description: >-
            Identifies the `data` payload shape:
            `urn:warehouse:<repo>:<events|analytics>:<EventName>:v<N>` —
            this repo's own urns when PUBLISHED (wes-work-planning), the
            producer's urn when CONSUMED (e.g. network-inventory-planning).
            The same occurrence carries the same `type` on both topics; the
            `dataschema` distinguishes the integration payload from the
            analytics payload.
          pattern: "^urn:warehouse:[a-z0-9-]+:(events|analytics):[A-Za-z]+:v[0-9]+$"

    ChargeForecastReceivedEvent:
      title: ChargeForecastReceived CloudEvent
      description: CloudEvent envelope for a recorded charge forecast.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - dataschema
            - data
          properties:
            type:
              type: string
              description: Fixed event type for this message.
              const: "com.warehouse.wes.work-planning.charge.ChargeForecastReceived"
            dataschema:
              type: string
              description: Fixed integration-payload schema id for this message.
              const: "urn:warehouse:wes-work-planning:events:ChargeForecastReceived:v1"
            data:
              type: object
              description: Payload published by the outbound Kafka adapter.
              required:
                - path_id
              properties:
                path_id:
                  type: string
                  description: >-
                    Identifier of the process path the charge forecast was
                    recorded for.

