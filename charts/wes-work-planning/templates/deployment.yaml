{{- include "wes-work-planning.requireDatabase" . -}}
{{- include "wes-work-planning.requireKafka" . -}}
{{- include "wes-work-planning.requireEventPublisher" . -}}
{{- include "wes-work-planning.requireGracePeriod" . -}}
{{- include "wes-work-planning.requireKafkaEnv" (dict "env" .Values.extraEnv "where" "extraEnv") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wes-work-planning.fullname" . }}
  labels:
    {{- include "wes-work-planning.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "wes-work-planning.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.pathCatalogue.enabled }}
        checksum/path-catalogue: {{ .Values.pathCatalogue.content | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "wes-work-planning.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wes-work-planning.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # D14 (2026-10-12): every config.* value (HTTP_ADDR, EVENT_PUBLISHER,
          # KAFKA_BROKERS, OUTBOX_MAX_ATTEMPTS) reaches cmd/wes through the
          # chart env ConfigMap. The explicit `env` entries below win over
          # envFrom for the same key and carry the same values, so nothing
          # changes for the variables already set here; the checksum/config
          # annotation above rolls the pods when the ConfigMap changes. Only
          # this Deployment mounts it: the ConfigMap's HTTP_ADDR is the API's
          # listen address. The path catalogue stays a separate volume.
          envFrom:
            - configMapRef:
                name: {{ include "wes-work-planning.fullname" . }}
          env:
            - name: HTTP_ADDR
              value: {{ .Values.config.httpAddr | quote }}
            - name: EVENT_PUBLISHER
              value: {{ .Values.config.eventPublisher | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: OUTBOX_MAX_ATTEMPTS
              value: {{ .Values.config.outboxMaxAttempts | quote }}
            # KAFKA_BROKERS is always set and required: Postgres and Kafka are
            # the only runtime (ADR-0044), so the render fails when it is empty.
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            # One stable consumer group per Kafka consumer; a missing one is a
            # boot error. extraEnv wins: warehouse-infra sets the
            # classification and replenishment groups there and a duplicate env
            # entry breaks ArgoCD's diff, so the chart default is rendered only
            # when extraEnv does not name the variable.
            {{- $extra := dict }}
            {{- range .Values.extraEnv }}
            {{- $_ := set $extra .name true }}
            {{- end }}
            - name: KAFKA_CONSUMER_GROUP
              value: {{ required "config.consumerGroup is required (KAFKA_CONSUMER_GROUP): the stable group of the integration-event consumer" .Values.config.consumerGroup | quote }}
            {{- if not (hasKey $extra "PRODUCT_CLASSIFICATION_CONSUMER_GROUP") }}
            - name: PRODUCT_CLASSIFICATION_CONSUMER_GROUP
              value: {{ required "config.productClassificationConsumerGroup is required (PRODUCT_CLASSIFICATION_CONSUMER_GROUP): the ProductClassified consumer is always on" .Values.config.productClassificationConsumerGroup | quote }}
            {{- end }}
            {{- if not (hasKey $extra "REPLENISHMENT_CONSUMER_GROUP") }}
            - name: REPLENISHMENT_CONSUMER_GROUP
              value: {{ required "config.replenishmentConsumerGroup is required (REPLENISHMENT_CONSUMER_GROUP): the replenishment consumer is always on" .Values.config.replenishmentConsumerGroup | quote }}
            {{- end }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "wes-work-planning.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # See values.yaml's database.migrationsExistingSecretKey comment
            # and ADR-0026 (mirroring order-management ADR-0029): a direct
            # (non-pooled) connection used only for the migration step in
            # cmd/wes's wireRepositories, never for the runtime pgxpool.
            # `optional: true` so a secret without this key yet (predates
            # this chart version) still starts the pod -- the binary falls
            # back to DATABASE_URL itself when this env var is unset.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "wes-work-planning.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- if .Values.pathCatalogue.enabled }}
            - name: PATH_CATALOGUE_FILE
              value: {{ .Values.pathCatalogue.mountPath }}/process-paths.yaml
            {{- end }}
            {{- range .Values.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          {{- if .Values.pathCatalogue.enabled }}
          volumeMounts:
            - name: path-catalogue
              mountPath: {{ .Values.pathCatalogue.mountPath }}
              readOnly: true
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.pathCatalogue.enabled }}
      volumes:
        - name: path-catalogue
          configMap:
            name: {{ .Values.pathCatalogue.existingConfigMap | default (printf "%s-path-catalogue" (include "wes-work-planning.fullname" .)) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
