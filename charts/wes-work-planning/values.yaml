# Default values for wes-work-planning.

replicaCount: 1

image:
  repository: wes-work-planning
  pullPolicy: IfNotPresent
  # Overrides the image tag; defaults to .Chart.AppVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: wes-work-planning.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API (HTTPRoute) as an additive, disabled-by-default alternative to
# the Ingress above. Chart-driven mirror of the shape verified live in
# warehouse-infra's fulfillment-execution Gateway API pilot. Flip
# gatewayApi.enabled to true (leaving ingress.enabled as-is or false) to
# route via Kong's Gateway API implementation instead of Ingress.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2) per independently-scalable
# workload type (Phase 3 scalability rollout, mirroring order-management
# ADR-0026 — see docs/docs/adr/0025-horizontal-autoscaling-and-pgxpool-tuning.md).
# Every block below defaults `enabled: false` so this PR cannot silently
# change production replica behaviour on merge — the fleet turns these on
# deliberately later, after this PR proves the shape is correct. When a
# component's autoscaling.<x>.enabled=true, that Deployment's own
# replicaCount / analytics.<x>.replicaCount / mcp.replicaCount value is
# OMITTED from the rendered manifest (see each deployment template's
# `{{- if not .Values.autoscaling.<x>.enabled }}` guard) so the HPA
# controller is the SOLE owner of .spec.replicas — a hardcoded `replicas:`
# field competing with the HPA would otherwise fight it on every reconcile.
autoscaling:
  # cmd/wes (this Deployment): stateless OLTP HTTP service, no
  # in-memory session state beyond a safe rebuild-from-Kafka local cache.
  # PATH_CATALOGUE_SOURCE=kafka wires a per-process-UNIQUE consumer
  # group id (kafkacatalog.uniqueConsumerGroup) purely to replay a
  # read-only cache — safe to run N independent copies of by design; the
  # fleet's own lesson about never sharing that kind of group is exactly
  # why it's already unique here. The only STABLE shared consumer group
  # this binary owns is the inbound integration-event consumer
  # (defaultConsumerGroup = "wes-work-planning", KAFKA_CONSUMER_GROUP
  # override) — the fleet's normal horizontally-scalable pattern, N
  # replicas share partitions via ordinary Kafka group rebalancing.
  # With PRODUCT_CLASSIFICATION_MODE=kafka (ADR-0035; not set by this
  # chart, so the default stays permissive) a second STABLE shared group,
  # PRODUCT_CLASSIFICATION_CONSUMER_GROUP, feeds the Postgres
  # product_classification_copy table — shared state, so every replica
  # MUST use the same value; the version-guarded upsert makes N>1 safe.
  # Nothing here breaks at N>1. max 4 / target 70% CPU, matching
  # order-management's identical api treatment.
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  # cmd/wes-projector: its analytics Kafka consumer group
  # (kafka.AnalyticsConsumerGroup == "wes-analytics") IS a stable, shared
  # name with no per-instance uniqueness (verified in
  # internal/adapters/inbound/kafka/analytics_consumer.go) -- the
  # fleet's correctly-scalable pattern, same shape as order-management's
  # equivalent projector -- so N replicas legitimately share the
  # analytics topic's partitions via normal Kafka rebalancing, not a
  # collision risk. Capped at 2, not left at api's 4, for the same two
  # reasons order-management's ADR-0026 documents: (a) the analytics
  # topic is keyed by the aggregate id (PathId/WorkUnit id --
  # kafka.AnalyticsPublisher's marshalAnalyticsData), so ordering is
  # only guaranteed per-aggregate/per-partition, and a wide fan-out buys
  # little extra throughput for what is a lightweight ON CONFLICT-upsert
  # workload; (b) every write is already idempotent on event_id via
  # PostgresProjection's claim/ON CONFLICT DO NOTHING (ADR-0011), so
  # correctness does not regress at 2, but there is no throughput case
  # yet that justifies more.
  projector:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  # cmd/wes-reports: stateless read-only REST reader over its own
  # read-only pgxpool (analyticsstore.NewReadOnlyPool) — no in-memory
  # state, safe to run N independent copies of. max 3 / target 70% CPU,
  # matching order-management's identical reports treatment.
  reports:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  # frontend (web/, nginx-unprivileged serving the built SPA bundle):
  # pure static-asset serving, no server-side session or per-request
  # state whatsoever -- the most trivially horizontally scalable
  # workload in this chart. max 3 / target 70% CPU, matching
  # order-management's identical frontend treatment.
  frontend:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
# mcp deliberately has NO autoscaling block here (skipped, not just
# disabled): cmd/mcp wraps github.com/modelcontextprotocol/go-sdk/mcp's
# StreamableHTTPHandler (internal/adapters/inbound/mcp/server.go,
# mcp.NewStreamableHTTPHandler), which keeps a per-process, in-memory
# session map keyed by the MCP protocol's own Mcp-Session-Id header — a
# real session, not just a TCP/HTTP connection (same SDK, same finding
# as order-management ADR-0026). charts/wes-work-planning/templates/
# mcp-service.yaml is a plain ClusterIP Service with no sessionAffinity
# configured, so a second request carrying the same Mcp-Session-Id
# (e.g. a multi-call MCP session, initialize then a later tools/call)
# could be routed by kube-proxy to a DIFFERENT pod than the one that
# created the session, which has never heard of that session id and
# would reject it. This is genuine in-memory-only per-replica state, not
# the OLTP api Deployment's read-only/rebuild-from-Kafka kind — mcp is
# NOT safely horizontally scalable as currently built. Making it so
# would require either sessionAffinity: ClientIP (a partial mitigation,
# not a fix -- it breaks the moment a client's IP changes, e.g. behind
# an LB) or a shared/external EventStore (mcp.StreamableHTTPOptions.
# EventStore) for session state, which is a real code change out of
# scope for this chart-and-pgxpool-tuning PR. mcp.replicaCount therefore
# stays a plain, un-autoscaled value (see mcp: below); revisit if/when
# the SDK wiring adopts Stateless mode or an external session store.

# --- application configuration ---
# The service falls back to in-memory adapters and a log-only event publisher
# when database.url / kafka.enabled are left empty, exactly like running the
# binary locally with no env vars set. Set database.url (or database.existingSecret)
# for a durable deployment.
config:
  httpAddr: ":8080"
  eventPublisher: "log"   # "log" or "kafka"
  logLevel: "info"        # debug | info | warn | error

database:
  # Plaintext URL (fine for local/dev clusters). Prefer existingSecret for
  # anything shared or long-lived.
  url: ""
  # Name of an existing Secret containing a DATABASE_URL key. Takes
  # precedence over database.url when set.
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same existingSecret, of a DIRECT (non-pooled, session-mode)
  # Postgres connection string used ONLY for the golang-migrate startup
  # step (cmd/wes's wireRepositories) -- never for the runtime pgxpool,
  # which always uses existingSecretKey/DATABASE_URL above, unchanged.
  # `optional: true` below so a secret that predates this key (local dev,
  # an environment whose Terraform hasn't been rolled yet) still starts
  # the pod: the Go binary's own getenv("MIGRATIONS_DATABASE_URL",
  # databaseURL) fallback then makes migrations run against DATABASE_URL,
  # exactly as before this key existed. See ADR
  # 0026-migrations-direct-postgres-connection.md (mirroring
  # order-management ADR-0029) for the PgBouncer/pg_advisory_lock
  # incompatibility this key exists to route migrations around.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"

kafka:
  enabled: false
  brokers: "kafka:9092"

# Deployment environment, exported as the deployment.environment.name OTel
# resource attribute (and available to anything else that wants it).
environment: "local"

# OpenTelemetry. The service pushes traces and metrics over OTLP/gRPC to the
# Collector at otel.endpoint; if nothing is listening there, telemetry is
# dropped and the service runs normally. Set otel.enabled=false to leave the
# env vars off entirely and fall back to the in-binary defaults. The endpoint
# accepts both the OTLP-spec URL form below and a bare "host:port".
otel:
  enabled: true
  endpoint: "http://otel-collector.observability.svc.cluster.local:4317"
  serviceName: "wes-work-planning"

# Extra environment variables appended verbatim (name/value or name/valueFrom).
extraEnv: []

# ---------------------------------------------------------------------------
# Process-path catalogue (ADR-0012 here / ADR-0017 in fulfillment-execution):
# a boot-time-required file this binary reads via PATH_CATALOGUE_FILE.
# warehouse-infra owns the canonical content (config/process-paths/*.yaml is
# the fleet's published-language source of truth, shared verbatim with
# fulfillment-execution and workforce-management) -- this chart just knows
# how to mount whatever content it's given.
# ---------------------------------------------------------------------------
pathCatalogue:
  enabled: true
  mountPath: "/etc/wes-work-planning"
  # Raw YAML content of the catalogue file (e.g. via --set-file or a
  # values.yaml `content: |` block). Ignored when existingConfigMap is set.
  content: ""
  # Name of a pre-existing ConfigMap with a "process-paths.yaml" data key.
  # When set, content above is ignored and no ConfigMap is created here.
  existingConfigMap: ""

startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    # /readyz (ADR-0023 §graceful shutdown), NOT /healthz: readiness
    # must flip to not-ready during a graceful SIGTERM drain (see
    # cmd/wes/main.go's shutdown sequence) so this pod stops receiving
    # NEW traffic while it finishes in-flight requests -- /healthz
    # stays a pure liveness signal ("is the process alive") and is
    # deliberately never flipped by shutdown, or Kubernetes would kill
    # the pod mid-drain instead of letting it finish.
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Bounds how long Kubernetes waits after SIGTERM before SIGKILLing this
# pod (ADR-0023): the HTTP Shutdown budget (5s, cmd/wes/main.go) plus
# the Kafka consumer/outbox-relay stop budget (5s, same file) plus
# margin for the readinessProbe's periodSeconds=5 to have observed the
# not-ready flip before traffic fully stops arriving.
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}

# --- analytics data product (ADR-0011) ---
# The per-service "Release Throughput & Backlog Health" report: a separate
# analytics topic, a writer (projector) and a read-only reader (reports),
# backed by a separate analytical database. Disabled by default so existing
# releases are unaffected; set analytics.enabled=true to deploy the two extra
# processes.
analytics:
  enabled: false
  # Directory (inside the image) of the analytical *.up.sql migrations the
  # projector applies on start.
  migrationsPath: "migrations/analytics"
  database:
    # The projector's read-write analytical DSN.
    projectorUrl: ""
    # The reader's DSN — a read-only role where possible; falls back to the
    # projector DSN when empty (local/dev).
    reportsUrl: ""
    # Name of an existing Secret with ANALYTICS_DATABASE_URL and
    # ANALYTICS_READER_DATABASE_URL keys. Takes precedence over the URLs above.
    existingSecret: ""
  projector:
    replicaCount: 1
    adminAddr: ":8091"
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  reports:
    replicaCount: 1
    httpAddr: ":8092"
    service:
      type: ClusterIP
      port: 80
      targetPort: 8092
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# --- MCP server (ADR-0008) ---
# The Model Context Protocol server: a second deployable (cmd/mcp, Streamable
# HTTP) that runs the same use cases as the OLTP service over the same
# database. Disabled by default so existing releases are unaffected; set
# mcp.enabled=true to deploy it. The MCP endpoint is served at both "/" and
# "/mcp"; "GET /healthz" backs the probes.
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"
  # Event publisher for events raised by MCP tools (release_next_work ...).
  # Empty inherits config.eventPublisher. "kafka" + a database writes outbox
  # rows that the api Deployment's relay drains (ADR-0008, ADR-0014); set the
  # same value as the api so WorkReleased reaches fulfillment-execution.
  eventPublisher: ""
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Base URL of the reports REST service for the get_release_throughput_report
  # tool. Leave empty to auto-point at this release's reports Service when
  # analytics.enabled=true (and register no report tool otherwise).
  reportsBaseUrl: ""
  # Extra environment variables for the MCP container only.
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# --- frontend (REMOTE Module Federation remote) ---
# The operator SPA remote, built from web/ and served by its own
# nginx-unprivileged pod. In the kind cluster it is reached through
# warehouse-infra's Nginx web gateway at http://localhost/mfes/wes-work-planning/
# -- never through Kong, which serves APIs only and must never handle HTML,
# JavaScript, CSS, fonts or images.
#
# Deliberately NO ingress/httproute/gatewayApi block here: frontend path
# routing is owned entirely by the Nginx web gateway, and the Service stays
# ClusterIP so this is not a second host-facing entrypoint.
#
# Disabled by default so existing releases are unaffected; warehouse-infra
# sets frontend.enabled=true and supplies the locally built image tag.
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/wes-work-planning-frontend
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 80
    targetPort: 8080
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
