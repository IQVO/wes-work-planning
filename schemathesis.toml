# Schemathesis config, auto-loaded by scripts/contract-test.sh (run from the
# repo root) and by the CI `contract` job.

# getWorkUnitsByReference is keyset-paged (REST guideline section 3). `cursor`
# is an opaque token OpenAPI can only call `string`, so Schemathesis sends a
# random schema-valid string and the service rightly answers 400
# `invalid-cursor`. Pinned by TestGetWorkUnitsByReference_BadPagingParameters
# (rest_guideline_test.go).
[[operations]]
include-operation-id = "getWorkUnitsByReference"

[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", "400", "401", "403", "404", "409", "429", "5xx"]

# enqueueWorkUnit carries pack-aware state rejections OpenAPI 3.0 cannot
# express (ADR-0045): pickUnit CASE for a SKU with no active
# CASE pack level in the empty contract-run store answers 422
# no-active-case-level, and the cross-field "pickUnit needs a sku" rule
# (invalid-pick-plan) answers 400 — neither is expressible in OpenAPI 3.0.
[[operations]]
include-operation-id = "enqueueWorkUnit"

[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", "400", "401", "403", "404", "409", "422", "429", "5xx"]
