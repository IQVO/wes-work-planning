{{- if and .Values.analytics.enabled .Values.analytics.reports.route.enabled -}}
{{- /*
Analytics reports exposure through Kong — replaces the Terraform-side
null_resource reports HTTPRoutes, for the same reason as kong-plugins.yaml:
chart-rendered routes are Helm/ArgoCD-reconciled forever, kubectl-applied
ones silently vanish on rebuild and nothing notices.

Host contract: /api/<context>/reports -> Service <context>-reports:80,
prefix rewritten to /reports (the reports binary registers
GET /reports/<report-name>, not a bare /<name>).
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "wes-work-planning.reportsFullname" . }}
  labels:
    {{- include "wes-work-planning.labels" . | nindent 4 }}
    app.kubernetes.io/component: reports
  annotations:
    konghq.com/plugins: {{ include "wes-work-planning.kongPluginNames" . | quote }}
    # Kong's traditional router turns both this PathPrefix and the API route's
    # /api/<context> prefix into regex paths; at equal priority their order is
    # unspecified, so /reports/... could land on the API Service (404). The
    # reports prefix must outrank the API prefix.
    konghq.com/regex-priority: "10"
spec:
  parentRefs:
    {{- range .Values.analytics.reports.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.analytics.reports.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /reports
      backendRefs:
        - name: {{ include "wes-work-planning.reportsFullname" . }}
          port: {{ .Values.analytics.reports.service.port }}
{{- end }}
