    PathCapacityChangedEvent:
      title: PathCapacityChanged CloudEvent
      description: >-
        CloudEvent envelope for a reported remaining-admission-capacity
        figure for a process path, correlated against a CPT cutoff
        timestamp (see ADR-0018).
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - dataschema
            - data
          properties:
            type:
              type: string
              description: Fixed event type for this message.
              const: "com.warehouse.wes.work-planning.workpool.PathCapacityChanged"
            dataschema:
              type: string
              description: Fixed integration-payload schema id for this message.
              const: "urn:warehouse:wes-work-planning:events:PathCapacityChanged:v1"
            data:
              type: object
              description: Payload published by the outbound Kafka adapter.
              required:
                - path_id
                - cutoff_at
                - remaining_units
                - known
              properties:
                path_id:
                  type: string
                  description: Identifier of the process path this capacity figure applies to.
                cutoff_at:
                  type: string
                  format: date-time
                  description: >-
                    RFC3339 CPT cutoff timestamp this remaining-capacity
                    figure applies to — this service's own native CPT
                    currency, NOT process-path-management's site-schedule
                    `cptId` string (see ADR-0018's correlation-by-timestamp
                    discussion). A consumer must correlate this timestamp
                    against its own cached CPT-window schedule to resolve
                    which `cptId` it corresponds to.
                remaining_units:
                  type: integer
                  format: int32
                  description: >-
                    How many more units this path can admit right now
                    (WIP limit minus current WIP; always non-negative
                    since the aggregate never admits past its own limit).
                    Meaningful only when `known` is `true`; always `0`
                    when `known` is `false`.
                known:
                  type: boolean
                  description: >-
                    `false` when this path is FlowFed (no hard admission
                    ceiling — only a backlog alarm threshold, not a
                    capacity figure) or when it is ReleaseFed with no WIP
                    limit provisioned. `true` otherwise.

