{{- if .Values.a2a.enabled }}
{{- include "wes-work-planning.requireDatabase" . -}}
{{- include "wes-work-planning.requireKafka" . -}}
{{- include "wes-work-planning.requireEventPublisher" . -}}
{{- include "wes-work-planning.requireKafkaEnv" (dict "env" .Values.a2a.extraEnv "where" "a2a.extraEnv") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wes-work-planning.a2aFullname" . }}
  labels:
    {{- include "wes-work-planning.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  replicas: {{ .Values.a2a.replicaCount }}
  selector:
    matchLabels:
      {{- include "wes-work-planning.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: a2a
  template:
    metadata:
      labels:
        {{- include "wes-work-planning.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: a2a
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wes-work-planning.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: a2a
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/a2a"]
          ports:
            - name: http
              containerPort: {{ .Values.a2a.service.targetPort }}
              protocol: TCP
          env:
            - name: A2A_ADDR
              value: {{ .Values.a2a.httpAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            # The A2A agent runs the SAME use cases as cmd/wes over the same
            # OLTP database (ADR-0046); it reuses the OLTP DATABASE_URL secret.
            # DATABASE_URL and KAFKA_BROKERS are mandatory (ADR-0044): the
            # render fails without them.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "wes-work-planning.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            # release_next_work raises WorkReleased: the A2A binary writes it
            # to outbox_events in the same transaction (ADR-0046, ADR-0014);
            # the relay stays in the api Deployment.
            - name: EVENT_PUBLISHER
              value: {{ .Values.a2a.eventPublisher | default .Values.config.eventPublisher | quote }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            # The Agent Card must advertise a URL agent clients can dial
            # (ADR-0046): default to this release's in-cluster Service DNS.
            - name: A2A_AGENT_URL
              value: {{ .Values.a2a.agentUrl | default (printf "http://%s.%s.svc.cluster.local:%d/" (include "wes-work-planning.a2aFullname" .) .Release.Namespace (int .Values.a2a.service.port)) | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "wes-work-planning-a2a"
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- end }}
            {{- range .Values.a2a.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.a2a.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
