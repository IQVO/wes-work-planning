    WorkReleasedEvent:
      title: WorkReleased CloudEvent
      description: >-
        CloudEvent envelope for a work unit admitted into active work by the
        release policy.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - dataschema
            - data
          properties:
            type:
              type: string
              description: Fixed event type for this message.
              const: "com.warehouse.wes.work-planning.workunit.WorkReleased"
            dataschema:
              type: string
              description: Fixed integration-payload schema id for this message.
              const: "urn:warehouse:wes-work-planning:events:WorkReleased:v1"
            data:
              type: object
              description: >-
                Payload published by the outbound Kafka adapter, enriched
                from the WorkUnit repository with the unit's CPT and
                reference, the caller-stated gift-wrap request when one was
                made (see ADR-0010), and — when the released unit carries a
                known SKU — with derived hazmat-capability/fragile hints
                read once, synchronously, from inventory-storage's product
                classification at publish time (see ADR-0009).
              required:
                - path_id
                - work_unit_id
                - cpt
                - ref
              properties:
                path_id:
                  type: string
                  description: >-
                    Identifier of the process path the work was released
                    into.
                work_unit_id:
                  type: string
                  description: Identifier of the released work unit.
                cpt:
                  type: string
                  description: >-
                    RFC3339 Critical Pull Time of the released unit — the
                    last moment it can be manifested and still make its
                    truck. Empty string if the unit could not be re-read at
                    publish time.
                ref:
                  type: string
                  description: >-
                    Caller-supplied business reference for the unit (for
                    example an order line). Empty string if the unit could
                    not be re-read at publish time.
                required_capabilities:
                  type: array
                  items:
                    type: string
                  description: >-
                    OPTIONAL. Present only when the released unit's SKU is
                    classified Hazmat in inventory-storage, in which case it
                    contains exactly `["hazmat"]`. Absent — not an empty
                    array — when the SKU is unclassified, unknown, or the
                    inventory-storage lookup is unavailable
                    (PRODUCT_CLASSIFICATION_MODE=permissive, the default, or
                    a lookup error). Consumers must treat an absent field
                    identically to an empty array. See ADR-0009.
                  example: ["hazmat"]
                fragile:
                  type: boolean
                  description: >-
                    OPTIONAL. Present and `true` only when the released
                    unit's SKU is classified Fragile in inventory-storage.
                    Absent — not `false` — when the SKU is unclassified,
                    unknown, or the lookup is unavailable. Consumers must
                    treat an absent field identically to `false`. See
                    ADR-0009.
                  example: true
                gift_wrap:
                  type: boolean
                  description: >-
                    OPTIONAL. Present and `true` only when the requester
                    asked the warehouse to produce a gift package for this
                    work unit, stated at enqueue time. This is a
                    caller-supplied `WorkReleased` characteristic, not a
                    derived product-classification hint — unlike
                    `required_capabilities`/`fragile`, it is read straight
                    off the `WorkUnit` and never looked up from
                    inventory-storage (see ADR-0010). Absent — not `false`
                    — when gift wrap was not requested. Consumers must
                    treat an absent field identically to `false`.
                  example: true

