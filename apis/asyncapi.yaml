                work_unit_id:
                  type: string
                  description: Identifier of the newly created work unit.

    WorkDemandReleasedEvent:
      title: WorkDemandReleased CloudEvent (consumed)
      description: >-
        CloudEvent envelope of network-inventory-planning's released
        transfer work demand, mirrored read-only from the producer's own
        contract. This service consumes it; it never publishes it.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - dataschema
            - data
          properties:
            type:
              type: string
              description: Fixed event type (the producer's own).
              const: "com.warehouse.wes.network-inventory-planning.workdemand.WorkDemandReleased"
            dataschema:
              type: string
              description: >-
                The producer's payload schema id. Overrides CloudEventBase's
                pattern (which only admits THIS repo's own urns): a consumed
                event carries the PRODUCER's urn.
              const: "urn:warehouse:network-inventory-planning:events:WorkDemandReleased:v1"
            data:
              type: object
              description: >-
                One released transfer demand leg. Every field is required by
                the producer; this service validates path_id against its
                process-path catalogue and work_kind against the declared
                enum before enqueueing the work unit.
              required:
                - demand_id
                - work_kind
                - transfer_ref
                - path_id
                - site_id
                - cpt
              properties:
                demand_id:
                  type: string
                  description: >-
                    Identity of the work demand. Becomes the deterministic
                    work_unit_id (and the generic operator `ref`) of the
                    enqueued work unit.
                work_kind:
                  type: string
                  description: Which leg of the transfer this demand executes.
                  enum:
                    - TRANSFER_PICK
                    - TRANSFER_DISPATCH
                    - TRANSFER_ARRIVAL
                transfer_ref:
                  type: string
                  description: The network transfer this demand belongs to.
                path_id:
                  type: string
                  description: >-
                    Process path the demand's work executes on (validated
                    against this service's process-path catalogue).
                site_id:
                  type: string
                  description: >-
                    Network site anchoring the leg — origin for
                    pick/dispatch, destination for arrival.
                cpt:
                  type: string
                  description: RFC3339 Critical Pull Time carried by the demand.
                sku:
                  type: string
                  description: OPTIONAL. SKU the demand moves, when known.
                quantity:
                  type: integer
                  description: OPTIONAL. Units of the SKU the leg moves.
                  minimum: 0

    ProductClassifiedEvent:
      title: ProductClassified CloudEvent (consumed)
      description: >-
        CloudEvent envelope of product-master's ProductClassified, mirrored
        read-only from the producer's own contract. This service consumes it;
        it never publishes it.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - dataschema
            - data
          properties:
            type:
              type: string
              description: Fixed event type (the producer's own).
              const: "com.warehouse.wms.product-master.product.ProductClassified"
            dataschema:
              type: string
              description: >-
                The producer's payload schema id. Overrides CloudEventBase's
                pattern (which only admits THIS repo's own urns): a consumed
                event carries the PRODUCER's urn.
              const: "urn:warehouse:product-master:events:ProductClassified:v1"
            data:
              type: object
              description: >-
                Full-state replacement of the SKU's classification. This
                service requires `sku` and a `version` of at least 1 and skips
                (WARN) anything else.
              required:
                - sku
                - handling_tags
                - classification_source
                - version
              properties:
                sku:
                  type: string
                  description: The classified SKU (also the Kafka key and the CloudEvents subject).
                handling_tags:
                  type: array
                  minItems: 1
                  description: Handling tags in stable order.
                  items:
                    type: string
                    enum:
                      - Hazmat
                      - Fragile
                      - TemperatureSensitive
                      - Oversized
                      - HighValue
                temperature_class:
                  type: string
                  description: OPTIONAL. Present only with TemperatureSensitive.
                  enum:
                    - Ambient
                    - Chilled
                    - Frozen
                dot_hazard_class:
                  type: integer
                  description: OPTIONAL. Present only with Hazmat. Stored, not surfaced.
                  minimum: 1
                  maximum: 9
                classification_source:
                  type: string
                  description: Migration artefact of the producer; ignored here.
                  enum:
                    - native
                    - legacy-import
                version:
                  type: integer
                  description: >-
                    The producer's aggregate version after the change. The
                    local copy applies a message only when this is greater
                    than the stored version.
                  minimum: 1

    WorkReleasedEvent:
      title: WorkReleased CloudEvent
      description: >-
        CloudEvent envelope for a work unit admitted into active work by the
        release policy.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - dataschema
            - data
          properties:
            type:
              type: string
              description: Fixed event type for this message.
              const: "com.warehouse.wes.work-planning.workunit.WorkReleased"
            dataschema:
              type: string
              description: Fixed integration-payload schema id for this message.
              const: "urn:warehouse:wes-work-planning:events:WorkReleased:v1"
            data:
              type: object
              description: >-
                Payload published by the outbound Kafka adapter, enriched
                from the WorkUnit repository with the unit's CPT and
                reference, the caller-stated gift-wrap request when one was
                made (see ADR-0010), and — when the released unit carries a
                known SKU — with derived hazmat-capability/fragile hints
                read once, at publish time, from the local copy of
                product-master's classification (see ADR-0009, ADR-0035).
              required:
                - path_id
                - work_unit_id
                - cpt
                - ref
              properties:
                path_id:
                  type: string
                  description: >-
                    Identifier of the process path the work was released
                    into.
                work_unit_id:
                  type: string
                  description: Identifier of the released work unit.
                line_no:
                  type: integer
                  minimum: 1
                  description: >-
                    OPTIONAL (ADR-0036). The 1-based order line this released
                    unit was made for, stored on the `WorkUnit` from the
                    `OrderAllocated` line that created it (the same number
                    embedded in a work-unit id of the form
                    `<order>-line-<n>`) and read straight off it at publish
                    time, like `ref`. Present only when known: absent — never
                    `0` or `null` — for a unit created before this field
                    existed, a REST-enqueued unit that gave no `lineNo`, and
                    every transfer-referenced unit. Consumers must treat an
                    absent field as "line unknown" and keep working.
                  example: 3
                cpt:
                  type: string
                  description: >-
                    RFC3339 Critical Pull Time of the released unit — the
                    last moment it can be manifested and still make its
                    truck. Empty string if the unit could not be re-read at
                    publish time.
                ref:
                  type: string
                  description: >-
                    Caller-supplied business reference for the unit (for
                    example an order line). Empty string if the unit could
                    not be re-read at publish time.
                required_capabilities:
                  type: array
                  items:
                    type: string
                  description: >-
                    OPTIONAL. Present only when the released unit's SKU is
                    classified Hazmat by product-master, in which case it
                    contains exactly `["hazmat"]`. Absent — not an empty
                    array — when the SKU is unclassified, not yet in the
                    local copy, or the copy is unreadable
                    (PRODUCT_CLASSIFICATION_MODE=permissive, the default, or
                    a lookup error). Consumers must treat an absent field
                    identically to an empty array. See ADR-0009, ADR-0035.
                  example: ["hazmat"]
                fragile:
                  type: boolean
                  description: >-
                    OPTIONAL. Present and `true` only when the released
                    unit's SKU is classified Fragile by product-master.
                    Absent — not `false` — when the SKU is unclassified,
                    unknown, or the lookup is unavailable. Consumers must
                    treat an absent field identically to `false`. See
                    ADR-0009, ADR-0035.
                  example: true
                gift_wrap:
                  type: boolean
                  description: >-
                    OPTIONAL. Present and `true` only when the requester
                    asked the warehouse to produce a gift package for this
                    work unit, stated at enqueue time. This is a
                    caller-supplied `WorkReleased` characteristic, not a
                    derived product-classification hint — unlike
                    `required_capabilities`/`fragile`, it is read straight
                    off the `WorkUnit` and never looked up from
                    inventory-storage (see ADR-0010). Absent — not `false`
                    — when gift wrap was not requested. Consumers must
                    treat an absent field identically to `false`.
                  example: true
                work_kind:
                  type: string
                  description: >-
                    OPTIONAL (ADR-0033). Present only on a
                    transfer-referenced work unit (one enqueued from
                    network-inventory-planning's WorkDemandReleased); names
                    the transfer leg it executes. Its presence is the
                    discriminator for "this is transfer work": every
                    order-driven unit omits all four transfer fields, so
                    its payload is byte-identical to before transfer
                    support existed. Consumers must treat absent as "not
                    transfer work".
                  enum:
                    - TRANSFER_PICK
                    - TRANSFER_DISPATCH
                    - TRANSFER_ARRIVAL
                  example: TRANSFER_PICK
                transfer_ref:
                  type: string
                  description: >-
                    OPTIONAL (ADR-0033). The network transfer reference this
                    released unit executes a leg of. Present only on a
                    transfer-referenced unit, and only when the demand
                    carried one.
                  example: TRF-2026-042
                site_id:
                  type: string
                  description: >-
                    OPTIONAL (ADR-0033). The network site anchoring this
                    transfer leg — origin for pick/dispatch, destination for
                    arrival. Present only on a transfer-referenced unit.
                  example: site-north-1
                quantity:
                  type: integer
                  description: >-
                    OPTIONAL (ADR-0033). Units of the SKU this transfer leg
                    moves. Present only on a transfer-referenced unit that
                    carried a positive quantity.
                  minimum: 0
                  example: 17

