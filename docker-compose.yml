services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wes
      POSTGRES_PASSWORD: wes
      POSTGRES_DB: wes
    ports:
      - "5432:5432"
    volumes:
      - wes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wes -d wes"]
      interval: 5s
      timeout: 5s
      retries: 5

  # A real single-node Kafka (KRaft) for local runs: the service has no
  # in-memory mode and refuses to boot without KAFKA_BROKERS (ADR-0044). The
  # image's default PLAINTEXT_HOST listener advertises localhost:9092, so
  # KAFKA_BROKERS=localhost:9092 works from the host. The broker auto-creates
  # topics on first write, like the cluster.
  kafka:
    image: confluentinc/confluent-local:7.6.1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  wes_postgres_data:
