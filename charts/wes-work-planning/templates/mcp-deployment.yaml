{{- if .Values.mcp.enabled }}
{{- include "wes-work-planning.requireDatabase" . -}}
{{- include "wes-work-planning.requireKafka" . -}}
{{- include "wes-work-planning.requireEventPublisher" . -}}
{{- include "wes-work-planning.requireKafkaEnv" (dict "env" .Values.mcp.extraEnv "where" "mcp.extraEnv") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wes-work-planning.mcpFullname" . }}
  labels:
    {{- include "wes-work-planning.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "wes-work-planning.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "wes-work-planning.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wes-work-planning.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/mcp"]
          ports:
            - name: http
              containerPort: {{ .Values.mcp.service.targetPort }}
              protocol: TCP
          env:
            - name: MCP_ADDR
              value: {{ .Values.mcp.httpAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            # The MCP binary runs the SAME use cases as cmd/wes over the same
            # OLTP database (ADR-0008); it reuses the OLTP DATABASE_URL secret.
            # DATABASE_URL and KAFKA_BROKERS are mandatory (ADR-0044): the
            # render fails without them.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "wes-work-planning.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            # release_next_work raises WorkReleased: the MCP binary writes it
            # to outbox_events in the same transaction (ADR-0008, ADR-0014);
            # the relay stays in the api Deployment.
            - name: EVENT_PUBLISHER
              value: {{ .Values.mcp.eventPublisher | default .Values.config.eventPublisher | quote }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            {{- if .Values.mcp.reportsBaseUrl }}
            - name: REPORTS_BASE_URL
              value: {{ .Values.mcp.reportsBaseUrl | quote }}
            {{- else if .Values.analytics.enabled }}
            # Point the get_release_throughput_report tool at this release's
            # own reports Service (ADR-0011) when analytics is deployed.
            - name: REPORTS_BASE_URL
              value: "http://{{ include "wes-work-planning.reportsFullname" . }}:{{ .Values.analytics.reports.service.port }}"
            {{- end }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "wes-work-planning-mcp"
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- end }}
            {{- range .Values.mcp.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
